services:
  postgres:
    image: postgres:17-alpine
    container_name: creator-lab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: creator_lab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - creator-lab-postgres-data:/var/lib/postgresql/data

volumes:
  creator-lab-postgres-data:
